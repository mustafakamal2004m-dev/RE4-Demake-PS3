name: Build PS3 Game

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with PS3 Docker
        uses: docker://ps3dev/ps3dev-toolchain:latest
        with:
          args: make

      - name: Upload .self file
        uses: actions/upload-artifact@v4
        with:
          name: RE4-Demake-PS3
          path: RE4-Demake-PS3.self

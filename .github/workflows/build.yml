
name: Build PS3 Game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check Cloud Build
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check Ubuntu tools
        run: |
          echo "GitHub cloud runner is working"
          uname -a
          cmake --version
          gcc --version
          g++ --version

      - name: Check project files
        run: |
          echo "Repository files:"
          ls -la
          echo "Build workflow test completed."
          

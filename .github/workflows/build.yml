name: Build PS3 Game
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps3dev/ps3dev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Model
        run: wget https://github.com/mustafakamal2004m-dev/RE4-Demake-PS3/releases/download/v1.0/leon.glb

      - name: Build Raylib
        run: |
          git clone --depth=1 https://github.com/nbe1233/raylib-ps3.git
          cd raylib-ps3
          make PLATFORM=PS3

      - name: Compile Game
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin
          ppu-gcc -o game.elf main.c -Iraylib-ps3/src -Lraylib-ps3/src -lraylib -lm -lrsx -lgcm_sys -lio -lsysutil -lrt -llv2
          ppu-objcopy -O binary game.elf game.bin
          make_self game.elf game.self

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PS3-Game
          path: game.self

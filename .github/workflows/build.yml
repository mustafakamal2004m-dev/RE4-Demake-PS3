name: Build PS3 Game
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Download Leon Model
        run: |
          wget https://github.com/mustafakamal2004m-dev/RE4-Demake-PS3/releases/download/v1.0/leon.glb
          
      - name: Setup PSL1GHT SDK
        run: |
          curl -sL https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz | tar xvz -C ./
          echo "PS3DEV=$PWD/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=$PWD/ps3dev" >> $GITHUB_ENV
          echo "$PWD/ps3dev/bin:$PWD/ps3dev/ppu/bin" >> $GITHUB_PATH
          
      - name: Build Game
        run: |
          ppu-gcc -o game.elf main.c -I$PSL1GHT/ppu/include -L$PSL1GHT/ppu/lib -lraylib -lm -lrsx -lgcm_sys -lio -lsysutil -lrt -llv2
          ppu-objcopy -O binary game.elf game.bin
          make_self game.elf game.self

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: PS3-Game
          path: game.self

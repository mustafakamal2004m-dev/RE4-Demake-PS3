
name: Realistic 3D Game Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            python3 \
            python3-pip \
            pkg-config

      - name: Check Build Environment
        run: |
          echo "3D Game Build Environment Ready"
          gcc --version
          cmake --version
          ninja --version

      - name: Show Project Files
        run: |
          echo "Project contents:"
          ls -la
          echo "Environment check complete"
          
